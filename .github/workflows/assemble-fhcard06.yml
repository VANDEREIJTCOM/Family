name: Assemble Family Hub 0.6 card

on:
  push:
    branches:
      - family-hub-0.6.0-full-hub
    paths:
      - build/fhcard06/trigger

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: family-hub-0.6.0-full-hub
      - name: Assemble card
        shell: bash
        run: |
          set -euo pipefail
          cat build/fhcard06/a0.b64 build/fhcard06/a1.b64 build/fhcard06/a2.b64 build/fhcard06/sub1.b64 build/fhcard06/sub2.b64 build/fhcard06/part01.b64 build/fhcard06/part02.b64 | base64 -d | gzip -d > vandereijt_family_hub/family-hub-card.js
          node --check vandereijt_family_hub/family-hub-card.js
          grep -q 'const FH_VERSION="0.6.0"' vandereijt_family_hub/family-hub-card.js
      - name: Commit card
        shell: bash
        run: |
          git config user.name "VANDEREIJT.COM Bot"
          git config user.email "pascal@vandereijt.com"
          git add vandereijt_family_hub/family-hub-card.js
          git commit -m "Build Family Hub 0.6 dashboard experience"
          git push
