name: Generate Family Hub branding

on:
  push:
    branches:
      - family-hub-0.5.0-dashboard-setup
    paths:
      - branding/generate_assets.py

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: family-hub-0.5.0-dashboard-setup
      - run: python -m pip install --disable-pip-version-check pillow
      - run: python branding/generate_assets.py
      - name: Commit generated assets
        run: |
          git config user.name "VANDEREIJT.COM Bot"
          git config user.email "pascal@vandereijt.com"
          git add vandereijt_family_hub/icon.png vandereijt_family_hub/logo.png vandereijt_family_hub/static/brand-icon.png
          if git diff --cached --quiet; then
            echo "Branding assets already current"
          else
            git commit -m "Generate Family Hub branding assets"
            git push
          fi
