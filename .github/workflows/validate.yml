name: Validate repository

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate required files
        shell: bash
        run: |
          set -euo pipefail
          test -f repository.yaml
          test -f vandereijt_family_hub/config.yaml
          test -f vandereijt_family_hub/Dockerfile
          test -f vandereijt_family_hub/app.py
          test -f vandereijt_family_hub/family-hub-card.js
          test -f vandereijt_family_hub/icon.png
          test -f vandereijt_family_hub/logo.png
          test -f vandereijt_family_hub/static/index.html
          test -f vandereijt_family_hub/static/app.js
          test -f vandereijt_family_hub/static/style.css
          test -f vandereijt_family_hub/static/brand-icon.png
          grep -q '^name:' repository.yaml
          grep -q '^version:' vandereijt_family_hub/config.yaml
          grep -q '^slug:' vandereijt_family_hub/config.yaml

      - name: Compile Python
        run: python -m py_compile vandereijt_family_hub/app.py

      - name: Check JavaScript syntax
        run: |
          node --check vandereijt_family_hub/family-hub-card.js
          node --check vandereijt_family_hub/static/app.js

      - name: Build App container
        run: docker build --build-arg BUILD_VERSION=0.5.0 --build-arg BUILD_ARCH=amd64 vandereijt_family_hub
