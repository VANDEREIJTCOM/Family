name: Validate repository

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate required files
        shell: bash
        run: |
          set -euo pipefail
          test -f repository.yaml
          test -f vandereijt_family_hub/config.yaml
          test -f vandereijt_family_hub/Dockerfile
          test -f vandereijt_family_hub/app.py
          test -f vandereijt_family_hub/family-hub-card.js
          test -f vandereijt_family_hub/icon.png
          test -f vandereijt_family_hub/logo.png
          test -f vandereijt_family_hub/static/index.html
          test -f vandereijt_family_hub/static/app.js
          test -f vandereijt_family_hub/static/family-hub-admin-0.6.5.js
          test -f vandereijt_family_hub/static/family-hub-admin-0.6.6.js
          test -f vandereijt_family_hub/static/family-hub-admin-0.6.7.js
          test -f vandereijt_family_hub/static/family-hub-admin-0.7.0.js
          test -f vandereijt_family_hub/static/family-hub-admin-0.7.1.js
          test -f vandereijt_family_hub/static/family-hub-admin-0.8.0.js
          test -f vandereijt_family_hub/static/family-hub-admin-0.8.1.js
          test -f vandereijt_family_hub/static/family-hub-admin-0.8.2.js
          test -f vandereijt_family_hub/static/family-hub-admin-0.8.3.js
          test -f vandereijt_family_hub/static/family-hub-admin-0.9.0.js
          test -f vandereijt_family_hub/static/family-hub-admin-0.9.0.css
          test -f vandereijt_family_hub/static/family-hub-admin-0.9.1.js
          test -f vandereijt_family_hub/static/family-hub-admin-0.9.1.css
          test -f vandereijt_family_hub/static/family-hub-admin-0.9.2.js
          test -f vandereijt_family_hub/static/family-hub-admin-0.9.2.css
          test -f vandereijt_family_hub/static/family-hub-admin-0.9.3.js
          test -f vandereijt_family_hub/static/family-hub-admin-0.9.3.css
          test -f vandereijt_family_hub/static/family-hub-admin-0.9.4.js
          test -f vandereijt_family_hub/static/family-hub-admin-0.9.4.css
          test -f vandereijt_family_hub/static/family-hub-admin-0.8.3.css
          test -f vandereijt_family_hub/static/family-hub-admin-0.8.2.css
          test -f vandereijt_family_hub/static/family-hub-admin-0.8.1.css
          test -f vandereijt_family_hub/static/style.css
          test -f vandereijt_family_hub/static/brand-icon.png
          grep -q '^name:' repository.yaml
          grep -q '^version:' vandereijt_family_hub/config.yaml
          grep -q '^slug:' vandereijt_family_hub/config.yaml

      - name: Compile Python
        run: python -m py_compile vandereijt_family_hub/app.py

      - name: Check JavaScript syntax
        run: |
          node --check vandereijt_family_hub/family-hub-card.js
          node --check vandereijt_family_hub/static/app.js
          node --check vandereijt_family_hub/static/family-hub-admin-0.6.5.js
          node --check vandereijt_family_hub/static/family-hub-admin-0.6.6.js
          node --check vandereijt_family_hub/static/family-hub-admin-0.6.7.js
          node --check vandereijt_family_hub/static/family-hub-admin-0.7.0.js
          node --check vandereijt_family_hub/static/family-hub-admin-0.7.1.js
          node --check vandereijt_family_hub/static/family-hub-admin-0.8.0.js
          node --check vandereijt_family_hub/static/family-hub-admin-0.8.1.js
          node --check vandereijt_family_hub/static/family-hub-admin-0.8.2.js
          node --check vandereijt_family_hub/static/family-hub-admin-0.8.3.js
          node --check vandereijt_family_hub/static/family-hub-admin-0.9.0.js
          node --check vandereijt_family_hub/static/family-hub-admin-0.9.1.js
          node --check vandereijt_family_hub/static/family-hub-admin-0.9.2.js
          node --check vandereijt_family_hub/static/family-hub-admin-0.9.3.js
          node --check vandereijt_family_hub/static/family-hub-admin-0.9.4.js
          grep -q 'const FH_ADMIN_VERSION="0.9.1"' vandereijt_family_hub/static/family-hub-admin-0.9.1.js
          grep -q 'const FH_ADMIN_VERSION="0.9.2"' vandereijt_family_hub/static/family-hub-admin-0.9.2.js
          grep -q 'const FH_ADMIN_VERSION="0.9.3"' vandereijt_family_hub/static/family-hub-admin-0.9.3.js
          grep -q 'const FH_ADMIN_VERSION="0.9.4"' vandereijt_family_hub/static/family-hub-admin-0.9.4.js
          grep -q '"panel": True' vandereijt_family_hub/app.py
          grep -q 'static getStubConfig' vandereijt_family_hub/family-hub-card.js
          grep -q 'config_url:"/local/family-hub/settings.json"' vandereijt_family_hub/family-hub-card.js
          grep -q 'def ensure_local_calendar' vandereijt_family_hub/app.py
          grep -q 'def ensure_local_todo' vandereijt_family_hub/app.py
          grep -q 'local_calendar' vandereijt_family_hub/app.py
          grep -q 'local_todo' vandereijt_family_hub/app.py
          grep -q 'def provision_family_features' vandereijt_family_hub/app.py
          grep -q 'def family_scheduler_loop' vandereijt_family_hub/app.py
          grep -q 'def ensure_points_helper' vandereijt_family_hub/app.py
          grep -q 'DEFAULT_NAVIGATION' vandereijt_family_hub/app.py
          grep -q '_navigation()' vandereijt_family_hub/family-hub-card.js
          grep -q '_screensaverHtml()' vandereijt_family_hub/family-hub-card.js
          grep -q '_rewardsScreen()' vandereijt_family_hub/family-hub-card.js
          grep -q '_departuresSection()' vandereijt_family_hub/family-hub-card.js
          grep -q 'FAMILY_HUB_APP_ROOT' vandereijt_family_hub/static/app.js
          grep -q 'document.currentScript' vandereijt_family_hub/static/app.js
          grep -q 'ensureSettingsShape' vandereijt_family_hub/static/app.js
          grep -q 'function listen' vandereijt_family_hub/static/app.js
          grep -q 'Opslaan mislukt' vandereijt_family_hub/static/app.js
          grep -q 'lovelace/resources/delete' vandereijt_family_hub/app.py
          grep -q 'customElements.get("family-hub-card")' vandereijt_family_hub/family-hub-card.js
          grep -q 'no-store, no-cache, must-revalidate' vandereijt_family_hub/app.py
          grep -q 'family-hub-admin-0.9.4.js' vandereijt_family_hub/static/index.html
          grep -q 'family-hub-admin-0.9.4.css' vandereijt_family_hub/static/index.html
          grep -q '_ensure_remote_calendar_ready' vandereijt_family_hub/app.py
          grep -q '_link_calendar_to_matching_member' vandereijt_family_hub/app.py
          grep -q 'inspect_remote_calendar_url' vandereijt_family_hub/app.py
          grep -q 'external_calendar_verify_ssl' vandereijt_family_hub/static/index.html
          grep -q 'fullscreen_mode' vandereijt_family_hub/app.py
          grep -q 'hass-kiosk-mode' vandereijt_family_hub/family-hub-card.js
          grep -q 'data-ha-overview' vandereijt_family_hub/family-hub-card.js
          grep -q 'fullscreen_mode' vandereijt_family_hub/static/family-hub-admin-0.9.2.js
          grep -q 'beheerinterface 0.9.0 start' vandereijt_family_hub/static/family-hub-admin-0.9.0.js
          grep -q 'show_in_calendar' vandereijt_family_hub/static/family-hub-admin-0.9.0.js
          grep -q 'rewardCycleLabel' vandereijt_family_hub/static/family-hub-admin-0.9.0.js
          grep -q 'Iedere dag' vandereijt_family_hub/static/family-hub-admin-0.9.0.js
          grep -q '_scheduledForDay' vandereijt_family_hub/family-hub-card.js
          grep -q '_toggleTodo' vandereijt_family_hub/family-hub-card.js
          grep -q '_periodPoints' vandereijt_family_hub/family-hub-card.js
          grep -q '_rewardClaimed' vandereijt_family_hub/family-hub-card.js
          grep -q 'data-task-detail' vandereijt_family_hub/family-hub-card.js
          grep -q 'data-event-detail' vandereijt_family_hub/family-hub-card.js
          grep -q 'reward_claim' vandereijt_family_hub/family-hub-card.js
          grep -q 'def normalize_remote_calendar_url' vandereijt_family_hub/app.py
          grep -q 'invalid_ics_file' vandereijt_family_hub/app.py
          grep -q 'Geheim adres in iCal-indeling' vandereijt_family_hub/static/family-hub-admin-0.9.0.js
          grep -q '"cycle": cycle' vandereijt_family_hub/app.py
          grep -q 'async function saveSection' vandereijt_family_hub/static/family-hub-admin-0.8.3.js
          grep -q 'function scheduleMemberAutosave' vandereijt_family_hub/static/family-hub-admin-0.8.3.js
          grep -q 'api("api/settings/section"' vandereijt_family_hub/static/family-hub-admin-0.8.3.js
          grep -q 'if(message)toast(message)' vandereijt_family_hub/static/family-hub-admin-0.8.3.js
          grep -q 'allowed = {"members", "routines", "smart_tasks", "lists", "rewards", "departure_rules"}' vandereijt_family_hub/app.py
          grep -q 'function syncMembersDraft' vandereijt_family_hub/static/family-hub-admin-0.8.2.js
          grep -q 'function syncStaticDraft' vandereijt_family_hub/static/family-hub-admin-0.8.2.js
          grep -q 'function syncDraftFromDom' vandereijt_family_hub/static/family-hub-admin-0.8.2.js
          grep -q 'syncDraftFromDom(false);settings=ensureSettingsShape(settings);settings.members.push' vandereijt_family_hub/static/family-hub-admin-0.8.2.js
          grep -q 'Toepassen' vandereijt_family_hub/static/family-hub-admin-0.8.2.js
          grep -q 'nog niet opgeslagen' vandereijt_family_hub/static/family-hub-admin-0.8.2.js
          grep -q 'bindRoutineActions(root)' vandereijt_family_hub/static/family-hub-admin-0.8.1.js
          grep -q 'bindSmartTaskActions(root)' vandereijt_family_hub/static/family-hub-admin-0.8.1.js
          grep -q 'bindListActions(root)' vandereijt_family_hub/static/family-hub-admin-0.8.1.js
          grep -q 'bindRewardActions(root)' vandereijt_family_hub/static/family-hub-admin-0.8.1.js
          grep -q 'bindDepartureActions(root)' vandereijt_family_hub/static/family-hub-admin-0.8.1.js
          grep -q '.manage-card:hover' vandereijt_family_hub/static/family-hub-admin-0.8.1.css
          grep -q 'ROUTINE_TEMPLATES' vandereijt_family_hub/static/family-hub-admin-0.8.0.js
          grep -q 'openRoutineEditor' vandereijt_family_hub/static/family-hub-admin-0.8.0.js
          grep -q 'loadSuggestions' vandereijt_family_hub/static/family-hub-admin-0.8.0.js
          grep -q 'member_ids' vandereijt_family_hub/app.py
          grep -q 'build_suggestions' vandereijt_family_hub/app.py
          grep -q 'apply_suggestion' vandereijt_family_hub/app.py
          grep -q 'add_calendar_event' vandereijt_family_hub/app.py
          grep -q '_routineMemberIds' vandereijt_family_hub/family-hub-card.js
          grep -q 'const FH_ADMIN_VERSION="0.7.1"' vandereijt_family_hub/static/family-hub-admin-0.7.1.js
          grep -q 'checkForFrontendUpdate' vandereijt_family_hub/static/family-hub-admin-0.7.1.js
          grep -q 'startVersionWatch' vandereijt_family_hub/static/family-hub-admin-0.7.1.js
          grep -q 'payload\["_app_version"\] = APP_VERSION' vandereijt_family_hub/app.py
          grep -q '_maybeReloadForVersion' vandereijt_family_hub/family-hub-card.js
          grep -q '_app_version' vandereijt_family_hub/family-hub-card.js
          grep -q 'const ICON_LIBRARY' vandereijt_family_hub/static/family-hub-admin-0.7.0.js
          grep -q 'data-routine-step' vandereijt_family_hub/static/family-hub-admin-0.7.0.js
          grep -q 'data-add-step' vandereijt_family_hub/static/family-hub-admin-0.7.0.js
          grep -q 'data-add-check' vandereijt_family_hub/static/family-hub-admin-0.7.0.js
          grep -q 'Punten voor afronden' vandereijt_family_hub/static/family-hub-admin-0.7.0.js
          grep -q 'if(!this._modal)this._render()' vandereijt_family_hub/family-hub-card.js
          grep -q 'if(this._modal){this._lastInteraction=Date.now();return;}' vandereijt_family_hub/family-hub-card.js
          grep -q 'function ensureSettingsShape(value)' vandereijt_family_hub/static/family-hub-admin-0.6.6.js
          grep -q 'let settings=ensureSettingsShape(null)' vandereijt_family_hub/static/family-hub-admin-0.6.6.js
          node - <<'NODE'
          const fs=require('fs'),vm=require('vm');
          const src=fs.readFileSync('vandereijt_family_hub/static/family-hub-admin-0.6.6.js','utf8');
          const prefix=src.split('const palette=')[0];
          vm.runInNewContext(prefix,{});
          NODE

      - name: Build App container
        run: docker build --build-arg BUILD_VERSION=0.9.4 --build-arg BUILD_ARCH=amd64 vandereijt_family_hub
